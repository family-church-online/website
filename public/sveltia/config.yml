backend:
  name: github
  repo: family-church-online/website
  branch: master
  # Auth proxy — see setup notes below. Replace with your deployed Worker URL.
  base_url: https://REPLACE_WITH_AUTH_WORKER_URL

site_url: https://familychurch.online
media_folder: public/images/uploads
public_folder: /images/uploads

collections:

  - name: devotion
    label: Devotions
    folder: src/content/devotion
    format: frontmatter
    extension: mdx
    create: true
    slug: "{{year}}-{{month}}-{{day}}"
    editor:
      preview: false
    fields:
      - { name: title, label: Title, widget: string }
      - name: date
        label: Date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DDTHH:mm:ss.SSSZ"
      - { name: image, label: Image URL, widget: string, required: false }
      - { name: sermonUrl, label: Related Sermon URL, widget: string, required: false }
      - name: keyScripture
        label: Key Scripture
        widget: object
        fields:
          - { name: ref, label: Reference (e.g. John 3:16), widget: string }
          - { name: text, label: Text, widget: text }
      - { name: reflection, label: Reflection, widget: text }
      - name: supportingScriptures
        label: Supporting Scriptures
        widget: list
        required: false
        fields:
          - { name: ref, label: Reference, widget: string }
          - { name: text, label: Text, widget: text }
      - { name: lifeApplication, label: Life Application, widget: text }
      - { name: prayer, label: Prayer, widget: text }
      - { name: body, label: Additional Notes, widget: markdown, required: false }

  - name: sermon
    label: Sermons
    folder: src/content/sermons
    format: frontmatter
    extension: mdx
    create: false
    editor:
      preview: false
    fields:
      - { name: title, label: Title, widget: string }
      - name: date
        label: Date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DDTHH:mm:ss.SSSZ"
      - { name: speaker, label: Speaker, widget: string }
      - { name: series, label: Series, widget: string, required: false }
      - { name: scripture, label: Scripture, widget: string, required: false }
      - { name: primaryTheme, label: Primary Theme, widget: string, required: false }
      - { name: image, label: Image URL, widget: string, required: false }
      - { name: audioUrl, label: Audio URL, widget: string, required: false }
      - name: additionalScriptures
        label: Additional Scriptures
        widget: list
        required: false
        fields:
          - { name: ref, label: Reference, widget: string }
          - { name: theme, label: Theme, widget: string }
      - { name: review, label: Hide from listing (draft), widget: boolean, default: false, required: false }
      - { name: body, label: Transcript, widget: markdown, required: false }

  - name: amplify
    label: Amplify — Teens
    folder: src/content/amplify
    format: frontmatter
    extension: mdx
    create: true
    slug: "{{year}}-{{month}}-{{day}}"
    editor:
      preview: false
    fields:
      - { name: title, label: Title, widget: string }
      - name: date
        label: Date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DDTHH:mm:ss.SSSZ"
      - { name: scripture, label: Key Scripture, widget: string, required: false, hint: "e.g. John 3:16" }
      - { name: body, label: Content, widget: markdown, required: false }

  - name: kids-preschool
    label: Kids Church — Pre-School
    folder: src/content/kids/preschool
    format: frontmatter
    extension: mdx
    create: true
    slug: "{{year}}-{{month}}-{{day}}"
    editor:
      preview: false
    fields:
      - { name: title, label: Title, widget: string }
      - name: date
        label: Date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DDTHH:mm:ss.SSSZ"
      - { name: scripture, label: Key Scripture, widget: string, required: false, hint: "e.g. John 3:16" }
      - { name: body, label: Content, widget: markdown, required: false }

  - name: kids-junior
    label: Kids Church — Junior
    folder: src/content/kids/junior
    format: frontmatter
    extension: mdx
    create: true
    slug: "{{year}}-{{month}}-{{day}}"
    editor:
      preview: false
    fields:
      - { name: title, label: Title, widget: string }
      - name: date
        label: Date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DDTHH:mm:ss.SSSZ"
      - { name: scripture, label: Key Scripture, widget: string, required: false, hint: "e.g. John 3:16" }
      - { name: body, label: Content, widget: markdown, required: false }

  - name: kids-senior
    label: Kids Church — Senior
    folder: src/content/kids/senior
    format: frontmatter
    extension: mdx
    create: true
    slug: "{{year}}-{{month}}-{{day}}"
    editor:
      preview: false
    fields:
      - { name: title, label: Title, widget: string }
      - name: date
        label: Date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DDTHH:mm:ss.SSSZ"
      - { name: scripture, label: Key Scripture, widget: string, required: false, hint: "e.g. John 3:16" }
      - { name: body, label: Content, widget: markdown, required: false }

# -----------------------------------------------------------------------
# Auth setup (one-time, ~10 minutes)
#
# Sveltia uses GitHub OAuth to commit changes on behalf of editors.
# You need a small proxy Worker that holds the OAuth secret.
#
# 1. Create a GitHub OAuth App:
#    github.com/settings/developers → New OAuth App
#    - Homepage URL:        https://familychurch.online
#    - Callback URL:        https://YOUR-WORKER.workers.dev/callback
#    Copy the Client ID and generate a Client Secret.
#
# 2. Deploy the auth proxy:
#    npx wrangler deploy node_modules/sveltia-cms-auth/dist/worker.js \
#      --name sveltia-auth \
#      --compatibility-date 2024-01-01
#    Then set the secrets:
#    npx wrangler secret put GITHUB_CLIENT_ID   --name sveltia-auth
#    npx wrangler secret put GITHUB_CLIENT_SECRET --name sveltia-auth
#
#    (Or deploy via the Cloudflare dashboard using the sveltia-cms-auth package.)
#
# 3. Replace base_url above with https://sveltia-auth.YOUR-ACCOUNT.workers.dev
# -----------------------------------------------------------------------
