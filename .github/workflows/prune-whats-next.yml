name: Prune past What's Next services

on:
  schedule:
    - cron: '0 22 * * 0'  # Every Sunday at 22:00 UTC (Monday 00:00 SA time)
  workflow_dispatch:

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Delete past service files
        run: |
          TODAY=$(TZ="Africa/Johannesburg" date +%Y-%m-%d)
          DELETED=0
          for f in src/content/whats-next/*.mdx; do
            [ -f "$f" ] || continue
            # Read the date from frontmatter, not the filename — filenames can be
            # creation-date-based when TinaCMS creates them before the date is set.
            DATE=$(grep -m1 '^date:' "$f" | sed 's/date: *//;s/T.*//' | tr -d '"'"'" | xargs)
            [ -z "$DATE" ] && continue
            if [[ "$DATE" < "$TODAY" ]]; then
              echo "Removing $f (frontmatter date $DATE < $TODAY)"
              rm "$f"
              DELETED=$((DELETED + 1))
            fi
          done
          echo "DELETED=$DELETED" >> "$GITHUB_ENV"

      - name: Commit if anything was removed
        if: env.DELETED != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/whats-next/
          git commit -m "chore(whats-next): auto-remove ${{ env.DELETED }} past service(s)"
          git push
